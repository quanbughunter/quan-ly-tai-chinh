<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bảng công nợ</title>
<meta name="description" content="Bảng đối chiếu công nợ gửi từ ứng dụng Quản lý tài chính.">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f3f3f9">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f46e5'/%3E%3Cpath d='M8 11h16M8 16h16M8 21h10' stroke='white' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
<!--
  Trang xem bảng công nợ — tệp độc lập, không gọi mạng. Dữ liệu nằm sau dấu # của link (trình duyệt không gửi phần này lên máy chủ):
    share.html#v1.<JSON nén deflate, base64url>   hoặc   share.html#v0.<JSON, base64url>
  Định dạng được tạo bởi web/js/statement.js — sửa bên đó thì sửa cả ở đây. Mọi chữ lấy từ link đều đặt bằng textContent, không bao giờ innerHTML.
-->
<style>
:root{
  --bg:#f3f3f9; --card:#ffffff; --fg:#1c1b2e; --muted:#67667f; --line:#dedcec; --head:#ecebf8; --zebra:#fafaff;
  --accent:#4f46e5; --accent-fg:#ffffff; --accent-soft:#eceafd; --up:#b45309; --down:#15803d;
  --note:#fff8e6; --note-line:#f0d9a2; --err:#b91c1c; color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#111019; --card:#1a1927; --fg:#ecebf7; --muted:#9c9bb8; --line:#34334b; --head:#262539; --zebra:#1e1d2d;
    --accent:#8f8bff; --accent-fg:#14122b; --accent-soft:#2a2850; --up:#fbbf6a; --down:#6ee7a0;
    --note:#2b2515; --note-line:#5b4a1c; --err:#f87171; color-scheme:dark;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--fg);
  font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  padding:max(20px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(32px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));
}
main{max-width:760px;margin:0 auto;display:grid;gap:16px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.tnum,td.num,th.num{font-variant-numeric:tabular-nums}

header .eyebrow{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
h1{margin:2px 0 12px;font-size:28px;line-height:1.15;letter-spacing:-.02em;text-wrap:balance}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px 16px;margin:0;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:14px}
.meta div{min-width:0}
.meta dt{font-size:12px;color:var(--muted)}
.meta dd{margin:0;font-weight:600;overflow-wrap:anywhere}

.sum{display:grid;gap:4px;padding:16px 18px;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:14px}
.sum .lab{font-size:14px;color:var(--muted)}
.sum .big{font-size:32px;font-weight:800;letter-spacing:-.02em;line-height:1.15;overflow-wrap:anywhere}
.sum .sub{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 14px}
.sum.zero{border-left-color:var(--down)}
.sum.zero .big{color:var(--down)}

.note{padding:12px 14px;background:var(--note);border:1px solid var(--note-line);border-radius:14px}
.note b{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.note p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}

.block{display:grid;gap:8px}
h2{margin:0;font-size:16px;display:flex;align-items:baseline;gap:8px}
h2 .cur{font-size:12px;font-weight:600;color:var(--muted);background:var(--accent-soft);padding:1px 8px;border-radius:99px}
.sheet{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:8px 10px;border:1px solid var(--line);vertical-align:top;text-align:left}
.sheet table{border-style:hidden}
thead th{background:var(--head);font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
tbody tr:nth-child(even) td{background:var(--zebra)}
td.num,th.num{text-align:right;white-space:nowrap}
td.date{white-space:nowrap;color:var(--muted)}
.dshort{display:none}
@media (min-width:600px){
  table.fixed{table-layout:fixed}
  table.fixed th:nth-child(1){width:112px} table.fixed th:nth-child(3),table.fixed th:nth-child(4){width:132px}
}
.what{font-weight:600}
.memo{color:var(--muted);overflow-wrap:anywhere}
.up{color:var(--up);font-weight:600}
.down{color:var(--down);font-weight:600}
td.bal{font-weight:700}
tr.open td{background:var(--head);font-style:italic}
tfoot td{background:var(--head);font-weight:600}
tfoot tr.final td{background:var(--accent);color:var(--accent-fg);font-weight:800;font-size:14.5px;border-color:var(--accent)}
.empty,.msg{padding:28px 18px;background:var(--card);border:1px solid var(--line);border-radius:14px;text-align:center;color:var(--muted)}
.msg.err b{color:var(--err)}
.msg b{display:block;font-size:17px;color:var(--fg);margin-bottom:4px}

footer{display:grid;gap:10px;font-size:12.5px;color:var(--muted)}
footer p{margin:0}
button{font:inherit;font-weight:600;padding:9px 16px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer;justify-self:start}
button:hover{border-color:var(--accent);color:var(--accent)}
.boot{padding:40px 0;text-align:center;color:var(--muted)}

@media (max-width:480px){
  h1{font-size:24px} .sum .big{font-size:28px}
  th,td{padding:7px 6px} table{font-size:13px}
  thead th{font-size:11px;letter-spacing:0}
  .dfull{display:none} .dshort{display:inline}
}
@media print{
  body{background:#fff;color:#000;padding:0}
  .sheet,.sum,.meta,.note{break-inside:avoid;border-color:#999}
  button{display:none}
}
</style>
</head>
<body>
<main id="app"><div class="boot">Đang mở bảng công nợ…</div></main>
<noscript><main><div class="msg err"><b>Cần bật JavaScript</b>Trang này cần JavaScript để hiển thị bảng công nợ.</div></main></noscript>
<script>
(function () {
  'use strict';
  var app = document.getElementById('app');
  var CUR = { VND: { s: '₫', d: 0 }, RUB: { s: '₽', d: 2 }, USD: { s: '$', d: 2 }, USDT: { s: 'USDT', d: 2 } };
  var SIGN = { lend: 1, repay_in: -1, borrow: -1, repay_out: 1 };
  var DATE_RE = /^\d{4}-\d{2}-\d{2}$/;
  var MINUS = '−';

  // ── tiện ích ──
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function add(parent) {
    for (var i = 1; i < arguments.length; i++) if (arguments[i]) parent.appendChild(arguments[i]);
    return parent;
  }
  function round6(x) { return Math.round((x + Number.EPSILON) * 1e6) / 1e6; }
  var nfs = {};
  function num(n, dec) {
    if (!nfs[dec]) nfs[dec] = new Intl.NumberFormat('vi-VN', { minimumFractionDigits: 0, maximumFractionDigits: dec });
    return nfs[dec].format(n);
  }
  function info(cur) { return CUR[cur] || { s: cur, d: 2 }; }
  // Có đơn vị: "560.000 ₫" / "12,5 $" / "30 USDT"; signed = thêm dấu + / −
  function money(n, cur, signed) {
    var i = info(cur), v = round6(n), sign = v < 0 ? MINUS : (signed && v > 0 ? '+' : '');
    return sign + num(Math.abs(v), i.d) + ' ' + i.s;
  }
  // Trong ô bảng: bỏ đơn vị cho gọn (đơn vị đã ghi ở tiêu đề bảng)
  function cell(n, cur, signed) {
    var i = info(cur), v = round6(n), sign = v < 0 ? MINUS : (signed && v > 0 ? '+' : '');
    return sign + num(Math.abs(v), i.d);
  }
  function fmtDate(s, short) { return s.slice(8, 10) + '/' + s.slice(5, 7) + '/' + (short ? s.slice(2, 4) : s.slice(0, 4)); }
  function who(st) { return st.o || 'Người gửi'; }

  // ── giải mã (định dạng của web/js/statement.js) ──
  function bytesFromB64u(s) {
    var bin = atob(s.replace(/-/g, '+').replace(/_/g, '/'));
    var out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }
  async function inflate(bytes) {
    if (typeof DecompressionStream !== 'function') throw new Error('old');
    var s = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate'));
    return new Uint8Array(await new Response(s).arrayBuffer());
  }
  function cut(s, n) { return String(s == null ? '' : s).trim().slice(0, n); }
  function validate(raw) {
    function bad() { throw new Error('bad'); }
    if (!raw || typeof raw !== 'object' || raw.v !== 1 || !Array.isArray(raw.c) || raw.c.length > 8) bad();
    var st = { o: cut(raw.o, 60), p: cut(raw.p, 60), d: DATE_RE.test(raw.d || '') ? raw.d : '', f: DATE_RE.test(raw.f || '') ? raw.f : '', n: cut(raw.n, 400), c: [] };
    var rows = 0;
    raw.c.forEach(function (b) {
      if (!b || typeof b.k !== 'string' || !/^[A-Z]{2,6}$/.test(b.k) || !Array.isArray(b.r)) bad();
      var open = Number(b.o || 0);
      if (!isFinite(open) || Math.abs(open) > 1e15) bad();
      var r = b.r.map(function (x) {
        if (!Array.isArray(x) || !DATE_RE.test(x[0]) || !SIGN[x[1]]) bad();
        var a = Number(x[2]);
        if (!isFinite(a) || a < 0 || a > 1e15) bad();
        rows += 1;
        if (rows > 2000) bad();
        return [x[0], x[1], a, cut(x[3], 120)];
      });
      st.c.push({ k: b.k, o: open, r: r });
    });
    return st;
  }
  async function decode(hash) {
    var m = /^#?v([01])\.([A-Za-z0-9_-]+)$/.exec((hash || '').trim());
    if (!m) throw new Error('bad');
    var bytes = bytesFromB64u(m[2]);
    if (m[1] === '1') bytes = await inflate(bytes);
    return validate(JSON.parse(new TextDecoder().decode(bytes)));
  }

  // ── hiển thị ──
  function message(title, text, err) {
    app.textContent = '';
    var box = el('div', 'msg' + (err ? ' err' : ''));
    add(box, el('b', '', title), document.createTextNode(text));
    app.appendChild(box);
  }

  function label(kind, st) {
    if (kind === 'lend') return 'Cho bạn vay';
    if (kind === 'repay_in') return 'Bạn trả nợ';
    if (kind === 'borrow') return who(st) + ' vay của bạn';
    return who(st) + ' trả nợ bạn';
  }

  // Tính số liệu một khối tiền tệ
  function figures(b) {
    var run = b.o, up = 0, down = 0;
    var rows = b.r.map(function (x) {
      var signed = SIGN[x[1]] * x[2];
      if (signed > 0) up += x[2]; else down += x[2];
      run = round6(run + signed);
      return { date: x[0], kind: x[1], amount: signed, memo: x[3], run: run };
    });
    return { open: b.o, up: round6(up), down: round6(down), balance: round6(b.o + up - down), rows: rows };
  }

  function summaryCard(st, b, f) {
    var zero = Math.abs(f.balance) < 1e-9;
    var card = el('section', 'sum' + (zero ? ' zero' : ''));
    var lab = zero ? 'Hai bên đã thanh toán đủ' : (f.balance > 0 ? 'Bạn còn nợ ' + who(st) : who(st) + ' còn nợ bạn');
    add(card, el('div', 'lab', lab), el('div', 'big tnum', money(Math.abs(f.balance), b.k)));
    var sub = el('div', 'sub');
    if (Math.abs(f.open) > 1e-9) add(sub, el('span', 'tnum', 'Đầu kỳ ' + money(f.open, b.k)));
    add(sub, el('span', 'tnum', 'Phát sinh ' + money(f.up, b.k)), el('span', 'tnum', 'Đã trả ' + money(f.down, b.k)), el('span', '', f.rows.length + ' dòng'));
    card.appendChild(sub);
    return card;
  }

  function sheet(st, b, f) {
    var block = el('section', 'block');
    var h = el('h2', '', 'Chi tiết');
    add(h, el('span', 'cur', b.k + ' · ' + info(b.k).s));
    block.appendChild(h);

    var wrap = el('div', 'sheet');
    var t = el('table', 'fixed');
    add(t, el('caption', 'sr', 'Chi tiết công nợ bằng ' + b.k));
    var thead = el('thead'), hr = el('tr');
    add(hr, el('th', '', 'Ngày'), el('th', '', 'Nội dung'), el('th', 'num', 'Phát sinh'), el('th', 'num', 'Còn nợ'));
    thead.appendChild(hr); t.appendChild(thead);

    var tb = el('tbody');
    if (Math.abs(f.open) > 1e-9 || st.f) {
      var o = el('tr', 'open');
      var oc = el('td', '', 'Số dư đầu kỳ' + (st.f ? ' (trước ' + fmtDate(st.f) + ')' : ''));
      oc.colSpan = 3;
      add(o, oc, el('td', 'num bal', cell(f.open, b.k)));
      tb.appendChild(o);
    }
    f.rows.forEach(function (r) {
      var tr = el('tr');
      var what = el('td'); add(what, el('div', 'what', label(r.kind, st)), r.memo ? el('div', 'memo', r.memo) : null);
      var dc = el('td', 'date');
      add(dc, el('span', 'dfull', fmtDate(r.date)), el('span', 'dshort', fmtDate(r.date, true)));
      add(tr, dc, what,
        el('td', 'num ' + (r.amount > 0 ? 'up' : 'down'), cell(r.amount, b.k, true)),
        el('td', 'num bal', cell(r.run, b.k)));
      tb.appendChild(tr);
    });
    t.appendChild(tb);

    var tf = el('tfoot');
    function line(text, value, cls) {
      var tr = el('tr', cls || '');
      var c = el('td', '', text); c.colSpan = 3;
      add(tr, c, el('td', 'num', value));
      tf.appendChild(tr);
    }
    if (Math.abs(f.open) > 1e-9) line('Số dư đầu kỳ', cell(f.open, b.k));
    line('Tổng phát sinh (tăng nợ)', cell(f.up, b.k, true));
    line('Tổng đã trả (giảm nợ)', f.down ? MINUS + cell(f.down, b.k) : cell(0, b.k));
    var zero = Math.abs(f.balance) < 1e-9;
    line(zero ? 'ĐÃ THANH TOÁN ĐỦ' : (f.balance > 0 ? 'BẠN CÒN NỢ ' + who(st).toUpperCase() : who(st).toUpperCase() + ' CÒN NỢ BẠN'), money(Math.abs(f.balance), b.k), 'final');
    t.appendChild(tf);

    wrap.appendChild(t); block.appendChild(wrap);
    return block;
  }

  function render(st) {
    document.title = 'Bảng công nợ' + (st.p ? ' — ' + st.p : '');
    app.textContent = '';

    var header = el('header');
    var meta = el('dl', 'meta');
    function item(k, v) { var d = el('div'); add(d, el('dt', '', k), el('dd', '', v)); meta.appendChild(d); }
    if (st.o) item('Người gửi', st.o);
    if (st.p) item('Dành cho', st.p);
    if (st.d) item('Tính đến ngày', fmtDate(st.d));
    if (st.f) item('Liệt kê từ ngày', fmtDate(st.f));
    add(header, el('div', 'eyebrow', 'Bảng công nợ'), el('h1', '', st.o ? 'Công nợ giữa bạn và ' + st.o : 'Công nợ của bạn'), meta.children.length ? meta : null);
    app.appendChild(header);

    if (!st.c.length) { app.appendChild(el('div', 'empty', 'Hiện chưa có khoản nợ nào giữa hai bên.')); }
    var figs = st.c.map(function (b) { return figures(b); });
    st.c.forEach(function (b, i) { app.appendChild(summaryCard(st, b, figs[i])); });
    if (st.n) { var n = el('section', 'note'); add(n, el('b', '', 'Ghi chú từ ' + who(st)), el('p', '', st.n)); app.appendChild(n); }
    st.c.forEach(function (b, i) { app.appendChild(sheet(st, b, figs[i])); });

    var foot = el('footer');
    add(foot,
      el('p', '', 'Số liệu tính đến ' + (st.d ? fmtDate(st.d) : 'thời điểm gửi link') + '. Nếu sau đó có thêm giao dịch, hãy xin người gửi link mới.'),
      el('p', '', 'Bảng do người gửi tự lập bằng ứng dụng Quản lý tài chính; nội dung nằm ngay trong đường link và chưa được bên thứ ba xác minh.'));
    var pb = el('button', '', 'In / lưu PDF'); pb.type = 'button'; pb.addEventListener('click', function () { window.print(); });
    foot.appendChild(pb);
    app.appendChild(foot);
  }

  async function main() {
    var hash = location.hash;
    if (!hash || hash === '#') {
      message('Chưa có dữ liệu', 'Hãy mở đúng đường link mà người gửi đã đưa cho bạn (link có phần dài sau dấu #).', false);
      return;
    }
    try {
      render(await decode(hash));
    } catch (e) {
      if (e && e.message === 'old') message('Trình duyệt quá cũ', 'Hãy mở link bằng Chrome, Safari hoặc Edge phiên bản mới.', true);
      else message('Không đọc được link', 'Link có thể bị cắt ngắn khi gửi qua ứng dụng chat. Nhờ người gửi gửi lại link, hoặc sao chép lại toàn bộ link.', true);
    }
  }
  window.addEventListener('hashchange', main);
  main();
})();
</script>
</body>
</html>
