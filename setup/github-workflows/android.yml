name: Dựng APK Android

# Chạy tay: tab Actions → "Dựng APK Android" → Run workflow. Hoặc đẩy một tag dạng v1.0.0.
# APK nằm ở mục Artifacts của lần chạy (tải về, giải nén, cài lên điện thoại).
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  apk:
    name: Dựng APK debug
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Chạy test
        run: npm test

      - name: Ghi config.js từ biến kho (nếu có)
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_ANON_KEY" ]; then
            node -e "require('fs').writeFileSync('web/config.js','window.APP_CONFIG = '+JSON.stringify({supabaseUrl:process.env.SUPABASE_URL,supabaseAnonKey:process.env.SUPABASE_ANON_KEY})+';\n')"
          fi

      - name: Cài thư viện
        run: npm install --no-audit --no-fund

      - name: Tạo dự án Android (thư mục android/ không lưu trong git)
        run: npx cap add android

      - name: Tạo icon và màn hình khởi động từ assets/
        run: npx capacitor-assets generate --android

      - name: Đồng bộ mã web vào dự án Android
        run: npx cap sync android

      # Tùy chọn: dùng một khóa ký cố định để cài đè bản mới lên bản cũ mà không phải gỡ app.
      # Tạo khóa một lần (cần JDK trên máy bạn):
      #   keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
      #   base64 -w0 debug.keystore      (Windows PowerShell: [Convert]::ToBase64String([IO.File]::ReadAllBytes("debug.keystore")))
      # rồi dán chuỗi vào secret DEBUG_KEYSTORE_BASE64 (Settings → Secrets and variables → Actions → Secrets).
      - name: Dùng khóa ký cố định (nếu có)
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            mkdir -p ~/.android
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore
            echo "Đã dùng khóa ký cố định."
          else
            echo "Không có DEBUG_KEYSTORE_BASE64 — mỗi lần dựng sẽ có chữ ký khác (cài bản mới cần gỡ bản cũ)."
          fi

      - name: Dựng APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: quan-ly-tai-chinh-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
